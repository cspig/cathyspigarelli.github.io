backend:
  name: github
  repo: cspig/cathyspigarelli.github.io
  branch: master
  base_url: https://decap-proxy.cathspig.workers.dev
  auth_endpoint: /auth

media_folder: static/img
public_folder: /img

collections:
  - name: post
    label: Blog Posts
    folder: content/post
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - { label: Publish Date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Author, name: author, widget: hidden, default: "Cathy Spigarelli" }
      - { label: Header Image, name: image, widget: image, required: false, media_folder: /static/img, public_folder: /img }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    folder: content
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: page }
      - { label: Title, name: title, widget: string, required: false }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - { label: Header Image, name: image, widget: image, required: false, media_folder: /static/img, public_folder: /img }
      - { label: Description, name: description, widget: string, required: false }
      - label: "Show in navigation bar"
        name: show_in_nav
        widget: boolean
        default: false
        hint: "Turn on to add a link to this page in the top navigation bar."
      - label: "Navbar order"
        name: weight
        widget: number
        default: 10
        value_type: int
        required: false
        hint: "Lower numbers appear first (leftmost) in the navigation bar. Only matters when 'Show in navigation bar' is on."
      - { label: Body, name: body, widget: markdown }

  - name: about
    label: About Page
    files:
      - label: About
        name: about
        file: content/about/index.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: page }
          - { label: Body, name: body, widget: markdown }
